<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: 'Google Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f6f7f9;
      color: #1a1c1e;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
      min-height: 100vh;
      margin: 0;
    }

    .receipt {
      width: 100%;
      max-width: 380px;
      margin-top: 28px;
      text-align: center;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      color: white;
      font-size: 26px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      transition: background-color 0.1s ease;
      background: #188038; /* fallback, overridden by JS */
    }

    .to-name {
      font-size: 17px;
      font-weight: 400;
      margin: 0;
    }

    .to-phone {
      font-size: 14px;
      color: #5f6368;
      margin: 4px 0 24px;
      letter-spacing: 0.5px;
    }

    .amount {
      font-size: 52px;
      font-weight: 400;
      margin: 0 0 28px;
      line-height: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
    }

    .amount .rupee {
      font-size: 30px;
      font-weight: 400;
      margin-top: 6px;
    }

    .pay-again {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 11px 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 22px 0 6px;
      font-size: 14px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #188038;
      color: white;
      font-weight: bold;
      font-size: 7px;
      padding-left: 1px;
      display: flex;
      align-items: center;
      text-align: center;
      justify-content: center;
    }

    .divider {
      border: none;
      border-top: 1px solid #e8eaed;
      margin: 12px 0;
    }

    .timestamp {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      text-align: left;
      overflow: hidden;
    }

    .bank-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid #e8eaed;
    }

    .bank-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      border: 1px solid rgb(194, 194, 194);
      height: 27px;
      width: 41px;
    }

    .bank-icon img {
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #1a73e8;
      font-weight: 700;
      flex-shrink: 0;
    }

    .bank-name {
      font-size: 14px;
      font-weight: 500;
      flex: 1;
    }

    .chevron img {
      color: black;
      width: 12px;
    }

    .details {
      padding: 4px 16px 16px;
    }

    .detail-block {
      padding: 12px 0;
    }

    .detail-label {
      font-size: 13px;
      font-weight: 500;
      margin: 0 0 4px;
    }

    .detail-value {
      font-size: 13px;
      color: #5f6368;
      margin: 0;
      word-break: break-all;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-self: center;
      gap: 60px;
      margin: auto;
      color: #939599;
      padding-top: 15px;
    }

    .powered-by {
      font-size: 6px;
    }

    .powered-by img {
      height: 16px;
    }

    .brand-mark img {
      height: 20px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .receipt {
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>

      // ---------- generate random receipt data ----------
      function generateReceiptData() {
        const sender = senderData[random(0, senderData.length - 1)];
        const recipient = recipientData[random(0, recipientData.length - 1)];

        // Amount: between 5000 and 8000, always ends with 0
        const base = random(500, 800); // 500 to 800
        const amount = base * 10; // now 5000, 5010, ... 8000
        const formattedAmount = amount.toLocaleString('en-IN');

        const upiTxn = String(random(100000000000, 999999999999));

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let txnId = '';
        for (let i = 0; i < 12; i++) {
          txnId += chars.charAt(random(0, chars.length - 1));
        }

        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const maxSeconds = Math.floor((now.getTime() - today.getTime()) / 1000);
        const randomSeconds = random(0, Math.max(0, maxSeconds));
        const t = new Date(today.getTime() + randomSeconds * 1000);
        const dateStr = t.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        const timeStr = t.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });

        const bankNumber = String(random(1000, 9999));
        const bankName = `State Bank of India ${bankNumber}`;

        const sat = random(55, 85);
        const lig = random(40, 65);
        const avatarBg = `hsl(${hue}, ${sat}%, ${lig}%)`;

          senderUpi: sender.upi,
          recipientName: recipient.name,
          recipientUpi: recipient.upi,
          recipientPhone: recipient.phone,
          amount: formattedAmount,
          upiTxn,
          txnId,
          timestamp,
          bankName,
          bankNumber,
          avatarLetter,
          avatarBg
        };
      }

        document.getElementById('fromDetail').textContent = `Google Pay • ${data.senderUpi}`;
